services:
  api:
    build: .
    image: acquire-english-api:latest
    container_name: acquire-english-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/acquire_english.db
    volumes:
      - api_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  api_data:
