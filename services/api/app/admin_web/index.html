<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AcquireEnglish 运营后台</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="loginView" class="shell login-shell hidden">
    <div class="login-card">
      <p class="eyebrow">AcquireEnglish</p>
      <h1>运营后台</h1>
      <p class="muted">账号密码 + 登录令牌（令牌可保存为本机文件）</p>
      <label class="field">
        <span>管理员账号</span>
        <input id="usernameInput" type="text" autocomplete="username" placeholder="admin" />
      </label>
      <label class="field">
        <span>管理员密码</span>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="密码" />
      </label>
      <label class="field">
        <span>登录令牌</span>
        <input id="tokenInput" type="password" autocomplete="off" placeholder="从本机令牌文件加载或粘贴" />
      </label>
      <div class="login-actions">
        <button id="loadTokenBtn" class="btn ghost" type="button">从本机文件加载令牌</button>
        <button id="saveTokenBtn" class="btn ghost" type="button">保存令牌到本机</button>
        <input id="tokenFileInput" type="file" accept=".token,.txt,text/plain" class="hidden" />
      </div>
      <button id="loginBtn" class="btn primary" type="button">进入后台</button>
      <p id="loginError" class="error"></p>
      <p class="muted login-hint">建议把令牌保存为 <code>acquireenglish-admin-login.token</code>，放在本机安全目录；不要提交到 Git。</p>
    </div>
  </div>

  <div id="appView" class="shell hidden">
    <header class="top">
      <div>
        <p class="eyebrow">AcquireEnglish Admin</p>
        <h1 id="pageTitle">可视化看板</h1>
      </div>
      <div class="top-actions">
        <button id="refreshBtn" class="btn ghost" type="button">刷新</button>
        <button id="logoutBtn" class="btn ghost" type="button">退出</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button type="button" data-tab="dashboard" class="tab active">看板</button>
      <button type="button" data-tab="infra" class="tab">ECS / 云盘监控</button>
      <button type="button" data-tab="usage" class="tab">Token / 损益</button>
      <button type="button" data-tab="resources" class="tab">公共资源</button>
      <button type="button" data-tab="users" class="tab">用户资产</button>
    </nav>

    <section id="panel-dashboard" class="tab-panel"></section>
    <section id="panel-infra" class="tab-panel hidden"></section>
    <section id="panel-usage" class="tab-panel hidden"></section>
    <section id="panel-resources" class="tab-panel hidden"></section>
    <section id="panel-users" class="tab-panel hidden">
      <section id="statsRow" class="stats"></section>
      <div class="layout">
        <aside class="panel">
          <div class="panel-head">
            <h2>用户</h2>
            <form id="searchForm" class="search">
              <input id="searchInput" type="search" placeholder="邮箱 / 手机 / 昵称 / ID" />
              <button class="btn primary" type="submit">搜索</button>
            </form>
          </div>
          <div id="userList" class="user-list"></div>
          <div class="pager">
            <button id="prevPage" class="btn ghost" type="button">上一页</button>
            <span id="pageInfo" class="muted"></span>
            <button id="nextPage" class="btn ghost" type="button">下一页</button>
          </div>
        </aside>
        <main class="panel detail">
          <div id="emptyDetail" class="empty">选择左侧用户查看资产</div>
          <div id="detailView" class="hidden"></div>
        </main>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
