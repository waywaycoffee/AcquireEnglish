# AcquireEnglish — https://acquireenglish.curlhairai.com
# Static web + /api → uvicorn :5200 + /media course files

server {
    listen 80;
    listen [::]:80;
    server_name acquireenglish.curlhairai.com acquireEnglish.curlhairAI.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://acquireenglish.curlhairai.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acquireenglish.curlhairai.com acquireEnglish.curlhairAI.com;

    ssl_certificate     /etc/letsencrypt/live/acquireenglish.curlhairai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acquireenglish.curlhairai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/acquireenglish/www;
    index index.html;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /media/ {
        alias /opt/acquireenglish/media/;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        types {
            video/mp4 mp4;
            text/plain srt vtt;
            image/jpeg jpg jpeg;
            image/png png;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=60";
    }
}
