# Static model packs for on-device Whisper / OCR (first-use download).
# Include inside the acquireenglish HTTPS server block.
location /models/ {
    alias /opt/acquireenglish/models/;
    add_header Accept-Ranges bytes;
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "public, max-age=86400";
    types {
        application/octet-stream bin;
        application/zip zip;
    }
    default_type application/octet-stream;
}
