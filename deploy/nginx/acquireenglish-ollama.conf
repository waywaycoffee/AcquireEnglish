# Public Ollama/OpenAI-compat proxy (phone must NOT need Tailscale).
# Upstream GPU box OpenAI shim :11434 via Tailscale CGNAT.
#
# App base URL: https://acquireenglish.curlhairai.com/ollama/v1
# Proxies /ollama/v1/... → http://100.115.252.55:11434/v1/...

location = /ollama {
    return 301 /ollama/;
}

location /ollama/ {
    proxy_pass http://100.115.252.55:11434/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_max_body_size 8m;
}
