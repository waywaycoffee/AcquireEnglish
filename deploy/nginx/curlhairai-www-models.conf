# Mirror AcquireEnglish model packs on the public product site.
# Include inside the www.curlhairai.com HTTPS server block.
location /models/ {
    alias /opt/acquireenglish/models/;
    add_header Accept-Ranges bytes;
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "public, max-age=86400";
    types {
        application/octet-stream bin;
        application/zip zip;
    }
    default_type application/octet-stream;
}
