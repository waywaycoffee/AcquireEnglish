# Public LiveTalking signaling proxy (phone must NOT need Tailscale).
# Upstream GPU box is reachable from ECS over Tailscale CGNAT.
# Include from sites-enabled (same pattern as oral-coach snippet).
#
# App base URL: https://acquireenglish.curlhairai.com/livetalking
# Proxies /livetalking/offer|human|… → http://100.115.252.55:8010/
#
# TLS for acquireenglish.curlhairai.com terminates on 127.0.0.1:8443 behind
# stream:443. Never let Location headers leak :8443 to phones.
# WebRTC media still needs TURN (see deploy/coturn/). HTTP proxy alone is not enough.

location = /livetalking {
    return 301 /livetalking/;
}

# Bypass aiohttp 302 / → /index.html (absolutized as https://host:8443/...).
location = /livetalking/ {
    proxy_pass http://100.115.252.55:8010/index.html;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
}

location /livetalking/ {
    proxy_pass http://100.115.252.55:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # LiveTalking redirects / → /index.html; keep clients under /livetalking/
    proxy_redirect / /livetalking/;
    proxy_redirect http://100.115.252.55:8010/ /livetalking/;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    client_max_body_size 16m;
}
