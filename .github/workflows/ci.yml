name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  local-monitor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy/gpu-box-ollama -p test_usage_monitor.py -v
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --ignore=tests/test_prod_e2e_suite.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
  mobile:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
      - name: Build production-flavor validation APK
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --debug --flavor prod --no-pub
      - name: Record APK provenance
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $apk = Get-Item build/app/outputs/flutter-apk/app-prod-debug.apk
          @(
            "commit=$env:GITHUB_SHA"
            "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "package=com.acquire.english"
            "sha256=$((Get-FileHash $apk.FullName -Algorithm SHA256).Hash)"
          ) | Set-Content (Join-Path $apk.DirectoryName build-info.txt)
      - name: Upload validation APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: acquire-english-prod-debug-${{ github.sha }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-prod-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/build-info.txt
          if-no-files-found: error
